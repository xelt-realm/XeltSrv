name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get ViaVersion jar (compile-only, never bundled)
        run: |
          mkdir -p lib
          gh release download --repo ViaVersion/ViaVersion \
            --pattern 'ViaVersion-[0-9.]*.jar' --dir lib
          ls lib
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build with Maven
        run: mvn -B package -DskipTests -Dviaversion.jar="$(pwd)/lib/$(ls lib | head -n 1)"

      - name: Create GitHub Release with the jar
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" target/SimpleLogin-*.jar \
            --title "$tag" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
